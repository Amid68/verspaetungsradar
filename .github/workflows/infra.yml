name: infra

on:
  push:
    paths:
      - infra/**
      - .tflint.hcl
      - .github/workflows/infra.yml
  pull_request:
    paths:
      - infra/**
      - .tflint.hcl
      - .github/workflows/infra.yml

permissions:
  contents: read

env:
  TFLINT_VERSION: 0.65.0
  TRIVY_VERSION: 0.76.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - name: Install tflint and trivy
        run: |
          base=https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}
          curl -sSfLO "$base/tflint_linux_amd64.zip"
          curl -sSfL "$base/checksums.txt" | grep tflint_linux_amd64.zip | sha256sum -c
          unzip tflint_linux_amd64.zip
          sudo install tflint /usr/local/bin/

          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          file=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep "$file" | sha256sum -c
          tar xzf "$file" trivy
          sudo install trivy /usr/local/bin/

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff infra

      - name: tofu validate
        working-directory: infra/management
        run: |
          tofu init
          tofu validate

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --chdir infra

      - name: trivy
        run: trivy config --exit-code 1 infra
