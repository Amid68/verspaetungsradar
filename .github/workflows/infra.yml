name: infra

on:
  push:
    paths:
      - infra/**
      - .tflint.hcl
      - .github/workflows/infra.yml
      - .github/scripts/install-tflint.sh
      - .github/scripts/install-trivy.sh
  pull_request:
    paths:
      - infra/**
      - .tflint.hcl
      - .github/workflows/infra.yml
      - .github/scripts/install-tflint.sh
      - .github/scripts/install-trivy.sh

permissions:
  contents: read

env:
  TFLINT_VERSION: 0.65.0
  TRIVY_VERSION: 0.76.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - run: .github/scripts/install-tflint.sh

      - run: .github/scripts/install-trivy.sh

      - run: tofu fmt -check -recursive -diff infra

      - run: tofu init -backend=false
        working-directory: infra/management

      - run: tofu validate
        working-directory: infra/management

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: tflint --recursive --config "$PWD/.tflint.hcl" --chdir infra

      - run: trivy config --exit-code 1 infra
