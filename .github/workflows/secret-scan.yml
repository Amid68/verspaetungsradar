name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.10.1

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: .github/scripts/install-betterleaks.sh

      - run: betterleaks git . --redact -v
